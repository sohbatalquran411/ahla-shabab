name: Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy source via FTP
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp 2>/dev/null
          lftp -c "
            set ftp:ssl-allow no
            open -u ${{ secrets.FTP_USER }},${{ secrets.FTP_PASSWORD }} ${{ secrets.FTP_HOST }}
            mirror -R --delete \
              --exclude .git/ \
              --exclude node_modules/ \
              --exclude .next/ \
              --exclude .github/ \
              --exclude .builds/ \
              --exclude .env* \
              ./ /public_html/
          "
          echo "Source code deployed. Run npm install && npm run build in Hostinger Node.js panel."